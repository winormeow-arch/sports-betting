name: sportsbet value bet

on:
  workflow_dispatch:          # Actions sekmesinden elle çalıştırma
  schedule:
    - cron: "0 6 * * 5"       # Her cuma 06:00 UTC (09:00 TR)

permissions:
  contents: write

defaults:
  run:
    shell: bash               # hata olursa adım gerçekten kırmızı olsun

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kütüphaneyi kur
        run: pip install sports-betting

      - name: Kuralı oluştur (2.5 ÜST < 1.6 ve favori 1.6-2.2 → ÜST)
        run: |
          cat > models.py <<'EOF'
          import numpy as np
          from sportsbet.evaluation import BaseBettor, find_latest_odds_column


          class KuralBettor(BaseBettor):
              """2.5 ÜST oranı 1.6'dan düşük VE favorinin oranı 1.6-2.2 arasında olan maçlara 2.5 ÜST oynar."""

              _APPEND_ODDS = True

              def _fit(self, X, Y, O):
                  return self

              def _predict_proba(self, X):
                  cols = list(X.columns)
                  ev = X[find_latest_odds_column(cols, 'home_win')]
                  dep = X[find_latest_odds_column(cols, 'away_win')]
                  ust = X[find_latest_odds_column(cols, 'over_2.5')]
                  favori = np.minimum(ev, dep)
                  kural = (ust < 1.6) & (favori >= 1.6) & (favori <= 2.2)
                  return kural.astype(float).to_numpy().reshape(-1, 1)


          bettor = KuralBettor(betting_markets=['over_2.5'], init_cash=10000.0, stake=50.0)
          EOF

      - name: Veriyi indir (football-data, ücretsiz)
        run: |
          sportsbet dataloader train extract --stats football-data --odds football-data \
            --league Germany --league Italy --league France --division 1 --division 2 \
            --year 2021 --year 2022 --year 2023 --year 2024 \
            --odds-type market_average -o dataloader.pkl > /dev/null

      - name: Backtest (geçmişte bu kural kazandırır mıydı?)
        run: |
          set -o pipefail
          mkdir -p sonuclar
          sportsbet evaluation backtest --dataloader dataloader.pkl --model models.py:bettor \
            --cv 5 -o sonuclar/backtest | tee sonuclar/backtest.txt

      - name: Kuralı hazırla
        run: |
          sportsbet evaluation fit --dataloader dataloader.pkl --model models.py:bettor -o model.pkl

      - name: Yaklaşan maçlarda kurala uyanlar
        run: |
          set -o pipefail
          sportsbet evaluation bet --dataloader dataloader.pkl --bettor model.pkl \
            -o sonuclar/value-bets | tee sonuclar/value-bets.txt

      - name: Sonuçları depoya kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add sonuclar/
          git commit -m "Value bet sonuçları $(date -u +%F)" || echo "Değişiklik yok"
          git push
